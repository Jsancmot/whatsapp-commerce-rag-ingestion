# Standalone compose for the RAG ingestion service.
#
# This service is fully self-contained:
#   - Spins up its own PostgreSQL + pgvector instance.
#   - The pipeline creates all required tables on startup (product,
#     storesetting, ingestion_sync_state) if they don't exist yet.
#   - Add seed data via the API or directly via psql/pgAdmin.
#
# Usage:
#   docker compose up             # run pipeline once and exit
#   docker compose up --build     # rebuild image before running
#
# To force a full re-index (ignore sync state):
#   Uncomment the `command` override below.

services:
  ingestion:
    build: .
    container_name: whatsapp_saas_rag_ingestion
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/whatsapp_commerce
    # Uncomment to force re-indexing on each run (useful in development):
    # command: ["python", "-m", "ingestion.main", "--force"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - rag_network
    # This is a one-shot job — it exits after the pipeline finishes.
    restart: "no"

  db:
    image: ankane/pgvector:v0.5.1
    container_name: whatsapp_saas_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=whatsapp_commerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init scripts run once on first start (when volume is empty), in alphabetical order:
      #   01_schema.sql → creates tables
      #   02_seed.sql   → inserts sample data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - rag_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d whatsapp_commerce" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  rag_network:
    driver: bridge

volumes:
  postgres_data:
