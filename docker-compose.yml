# Standalone compose for local development of the ingestion service.
# The DB service mirrors the one in whatsapp-commerce-backend so both
# can share the same postgres_data volume when run together.
#
# To run alongside the backend, point DATABASE_URL to the backend's DB container.

services:
  ingestion:
    build: .
    container_name: whatsapp_saas_rag_ingestion
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/whatsapp_commerce
    # Override CMD to force re-indexing on each run (useful in development)
    # command: ["python", "-m", "ingestion.main", "--force"]
    depends_on:
      db:
        condition: service_healthy # Wait until PostgreSQL is truly ready
    networks:
      - rag_network
    # This is a one-shot job - it exits after the pipeline finishes.
    restart: "no"

  db:
    image: ankane/pgvector:v0.5.1
    container_name: whatsapp_saas_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=whatsapp_commerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d whatsapp_commerce" ]
      interval: 5s # Check every 5 seconds
      timeout: 5s # Fail if no response in 5 seconds
      retries: 10 # Retry up to 10 times before declaring unhealthy
      start_period: 10s # Give PostgreSQL 10 seconds to boot before health checks begin

networks:
  rag_network:
    driver: bridge

volumes:
  postgres_data:
