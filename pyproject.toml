[project]
name = "whatsapp-commerce-rag-ingestion"
version = "0.1.0"
description = "RAG ingestion pipeline for WhatsApp Commerce SaaS"
requires-python = ">=3.11"

dependencies = [
    "sqlmodel>=0.0.14",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    "langchain>=0.3",
    "langchain-postgres>=0.0.12",
    "langchain-openai>=0.2",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.27",
    "redis>=5.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ingestion*"]
